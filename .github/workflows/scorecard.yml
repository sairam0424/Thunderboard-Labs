# OSSF Scorecard supply-chain analysis for Thunderboard-Labs.
# ---------------------------------------------------------------------------
# Public repo -> Scorecard's supply-chain signal (SHA-pinning, branch
# protection, dependency update tooling, etc.) is valuable and cheap to add.
# Results are published to the public Scorecard API/badge (this is a public
# OSS repo) and uploaded to this repo's code-scanning tab.
name: Scorecard analysis

on:
  branch_protection_rule:
  push:
    branches: [develop]
  schedule:
    # Weekly - independent cadence from the CodeQL cron so the two don't
    # contend for runner minutes.
    - cron: "30 2 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          sarif_file: results.sarif
